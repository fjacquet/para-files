name: Release

# Trigger: push a semver tag, e.g.:
#   git tag v1.5 && git push --tags
#
# Both vX.Y and vX.Y.Z are accepted; this repo has used vX.Y since v1.0.
#
# Before tagging, update both:
#   - pyproject.toml             → version = "x.y.z"
#   - src/para_files/__init__.py → __version__ = "x.y.z"

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  # ── 1. Test ────────────────────────────────────────────────────────────────
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      # v1.4 and v1.5 were both tagged without bumping pyproject.toml (it is
      # still "1.4" today, two tags behind). Nothing caught it: test_version
      # only compares __version__ against the installed distribution
      # metadata, which stays self-consistent even when both are stale — it
      # never looks at the git tag. Fail fast, before build/publish, instead
      # of shipping a wheel whose embedded version doesn't match its release.
      - name: Verify Tag Matches Declared Version
        run: |
          set -euo pipefail
          declared=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$declared" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME}, but pyproject.toml declares ${declared}"
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install CLI dependencies
        run: brew install pandoc exiftool

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest -m "not slow" -q

  # ── 2. Build wheel + sdist ─────────────────────────────────────────────────
  build:
    runs-on: macos-14
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── 3. GitHub Release ──────────────────────────────────────────────────────
  github-release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
