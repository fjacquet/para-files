title: para-files
description: "File documents into a PARA tree: rules, issuers, ISBN books and an optional cloud model, with preview, journal and undo."
remote_theme: just-the-docs/just-the-docs
color_scheme: dark

url: "https://fjacquet.github.io"
baseurl: "/para-files"

aux_links:
  "View on GitHub":
    - "https://github.com/fjacquet/para-files"

nav_enabled: true
search_enabled: true
heading_anchors: true

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

footer_content: "Copyright &copy; 2025 Frédéric Jacquet. Distributed under the <a href=\"https://github.com/fjacquet/para-files/blob/main/LICENSE\">MIT license.</a>"

# Keep the archive out of the navigation; its pages stay reachable by link.
defaults:
  - scope:
      path: "archive"
    values:
      nav_exclude: true

# Mermaid support
mermaid:
  version: "10.6.0"

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false
